<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="df-t df-d" font-family="Segoe UI, Roboto, Arial, sans-serif">
<title id="df-t">Drainage field layout from above</title>
<desc id="df-d">Bird's-eye view of a garden. The house connects to a tank, which feeds a drainage field of parallel perforated pipes in gravel trenches. The field is at least 15 metres from the house and at least 10 metres from a stream, with no driveway over it. A tank should be within 30 metres of where a tanker can park.</desc>
<defs><marker id="df-a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1D2327"/></marker></defs>
<rect width="800" height="440" fill="#9cc47a"/>
<text x="400" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#1E4D45">A drainage field, from above</text>
<!-- road / tanker -->
<rect x="0" y="380" width="800" height="60" fill="#8f9396"/>
<path d="M0 410H800" stroke="#fff" stroke-width="3" stroke-dasharray="20 14"/>
<rect x="40" y="388" width="90" height="36" rx="6" fill="#1E4D45"/><rect x="130" y="394" width="26" height="30" rx="4" fill="#163a34"/>
<text x="85" y="411" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">TANKER</text>
<!-- house -->
<rect x="40" y="70" width="140" height="100" fill="#E9D3A6" stroke="#1D2327" stroke-width="3"/>
<path d="M40 70L110 120L180 70M40 170L110 120L180 170" stroke="#1E4D45" stroke-width="3" fill="none"/>
<text x="110" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#1D2327">House</text>
<!-- driveway -->
<rect x="190" y="200" width="70" height="180" fill="#c9c3b5"/>
<text x="225" y="300" text-anchor="middle" font-size="12" fill="#1D2327" transform="rotate(-90 225 300)">Driveway</text>
<!-- pipe & tank -->
<path d="M150 170V250H290" stroke="#5a5f63" stroke-width="7" fill="none"/>
<rect x="290" y="226" width="70" height="50" rx="10" fill="#c7d6d9" stroke="#1D2327" stroke-width="3"/>
<text x="325" y="256" text-anchor="middle" font-size="12" font-weight="700" fill="#1D2327">Tank</text>
<path d="M360 250H420" stroke="#5a5f63" stroke-width="7"/>
<!-- distribution + trenches -->
<rect x="420" y="150" width="14" height="200" fill="#5a5f63"/>
<g fill="#b9b2a2" stroke="#8d8676" stroke-width="2">
<rect x="434" y="158" width="230" height="22" rx="4"/><rect x="434" y="208" width="230" height="22" rx="4"/><rect x="434" y="258" width="230" height="22" rx="4"/><rect x="434" y="308" width="230" height="22" rx="4"/>
</g>
<g stroke="#2E7C88" stroke-width="4" stroke-dasharray="6 5"><path d="M434 169H660"/><path d="M434 219H660"/><path d="M434 269H660"/><path d="M434 319H660"/></g>
<text x="549" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#1D2327">Perforated pipes in gravel trenches</text>
<!-- stream -->
<path d="M740 60Q770 160 735 250T760 380H800V60Z" fill="#2E7C88"/>
<text x="770" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" transform="rotate(90 770 230)">Stream</text>
<!-- dimension lines -->
<path d="M186 120H424" stroke="#1D2327" stroke-width="2" marker-start="url(#df-a)" marker-end="url(#df-a)"/>
<rect x="250" y="104" width="110" height="26" rx="13" fill="#C4943B"/><text x="305" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#1D2327">15m or more</text>
<path d="M668 210H732" stroke="#1D2327" stroke-width="2" marker-start="url(#df-a)" marker-end="url(#df-a)"/>
<rect x="660" y="226" width="80" height="26" rx="13" fill="#C4943B"/><text x="700" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#1D2327">10m+</text>
<path d="M325 282V376" stroke="#1D2327" stroke-width="2" marker-start="url(#df-a)" marker-end="url(#df-a)"/>
<rect x="335" y="316" width="140" height="26" rx="13" fill="#fff"/><text x="405" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#1D2327">tanker within 30m</text>
<text x="549" y="364" text-anchor="middle" font-size="13" fill="#1D2327">No driveways, patios or other pipes over the field</text>
</svg>
